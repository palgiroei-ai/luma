<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800&family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #F5F1EA; color: #14243B; font-family: 'Heebo', sans-serif; }
  .wrap { box-sizing: border-box; height: 100%; padding: 80px 96px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 22px; border-bottom: 14px solid #14243B; }
  .brand { display: flex; align-items: center; gap: 22px; direction: ltr; justify-content: center; }
  .wm { font-family: 'Jost', sans-serif; font-weight: 500; font-size: 104px; letter-spacing: .32em; padding-left: .32em; line-height: 1; }
  .acr { font-family: 'Jost', sans-serif; direction: ltr; text-align: center; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: #5B6676; }
  .acr b { color: #9C5A2A; font-weight: 500; }
  .slogan { font-size: 58px; font-weight: 800; margin-top: 18px; }
  .slogan em { font-style: normal; color: #C0743A; }
  .by { font-size: 26px; font-weight: 500; color: #5B6676; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="wm">LUMA</span>
      <svg width="96" height="96" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="16" stroke="#C0743A" stroke-width="2.4" opacity=".6"/><path d="M6 22h7l3-8 5 14 3-6h10" stroke="#14243B" stroke-width="2.4"/></svg>
    </div>
    <div class="acr"><b>L</b>ive · <b>U</b>nified · <b>M</b>anagement-system for <b>A</b>thletes</div>
    <div class="slogan">כל הקבוצה. מערכת אחת. <em>בזמן אמת.</em></div>
    <div class="by">לקבוצות, ארגונים ומאמנים אישיים · מבית PalgiTraining</div>
  </div>
</body>
</html>
