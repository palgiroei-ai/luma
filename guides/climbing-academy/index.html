<style>
  /* Layout: one column — brand header, chapter strip, the phone "screen" playing the steps, the caption
     under it, then the transport. Colors are the app's own (Climbing Academy brand), one light look. */
  :root {
    --chalk: #F5F1EA;        /* app background */
    --card: #FFFFFF;
    --ink: #2E1A47;          /* brand purple: text + phone body */
    --ink-soft: #6A5F78;
    --line: #E4DCCF;
    --ember: #C8642E;        /* brand orange: finger, progress, active chapter */
    --ember-soft: #F6E6DA;
    --font: "Heebo", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--chalk); color: var(--ink); font-family: var(--font); }
  /* Everything (phone + explanation + buttons) fits one screen: fit() sizes the phone to the space left. */
  /* Portrait phone: one column (top, phone, explanation). Wide screens: the phone on one side at full
     height, the explanation and buttons beside it. */
  .wrap { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
  .top, .bottom { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .wide .wrap { max-width: 1000px; display: grid; grid-template-columns: auto minmax(0, 440px); grid-template-areas: "phone top" "phone bottom";
    grid-template-rows: auto 1fr; justify-content: center; column-gap: 48px; row-gap: 14px; align-items: start; padding-block: 28px; }
  .wide .top { grid-area: top; padding-top: 12px; }
  .wide .bottom { grid-area: bottom; gap: 12px; }
  .wide .phone { grid-area: phone; margin: 0; }
  .wide h1 { font-size: 26px; }
  .wide .intro { font-size: 16px; }
  .wide .caption h2 { font-size: 22px; }
  .wide .caption p { font-size: 17px; line-height: 1.6; }
  .wide .controls { justify-content: flex-start; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header img { height: 28px; width: auto; flex: none; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; text-wrap: balance; min-width: 0; }
  .intro { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.45; }

  .chapters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chapters::-webkit-scrollbar { display: none; }
  .chap { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 6px 12px; font: 500 13px var(--font); cursor: pointer; white-space: nowrap; }
  .chap[aria-current="true"] { background: var(--ember-soft); border-color: var(--ember); color: var(--ink); font-weight: 700; }

  /* The frame wraps the screen; the screen itself has the app's exact 390×844 shape, so nothing is cropped. */
  .phone { position: relative; width: min(330px, 100%); max-width: 100%; margin: 0 auto; flex: none;
    background: var(--ink); border-radius: 34px; padding: 10px; box-shadow: 0 18px 40px rgba(46, 26, 71, .22); }
  .screen { position: relative; width: 100%; aspect-ratio: 390 / 844; border-radius: 22px; overflow: hidden; background: var(--chalk); cursor: default; }
  .screen.practice { cursor: pointer; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0; transition: opacity .45s ease; }
  .screen img.on { opacity: 1; }

  .finger { position: absolute; z-index: 4; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: rgba(200, 100, 46, .35); border: 3px solid var(--ember); box-shadow: 0 4px 12px rgba(46, 26, 71, .25);
    opacity: 0; transition: left .9s cubic-bezier(.3,.7,.2,1), top .9s cubic-bezier(.3,.7,.2,1), opacity .3s, transform .15s; pointer-events: none; }
  .finger.show { opacity: 1; }
  .finger.press { transform: scale(.82); }
  .ripple { position: absolute; z-index: 4; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--ember);
    pointer-events: none; animation: ripple .6s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  .target { position: absolute; z-index: 4; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; border: 3px solid var(--ember);
    pointer-events: none; animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.9); opacity: 1; } 50% { transform: scale(1.15); opacity: .55; } }

  .caption { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
  .caption .meta { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--ember); font-variant-numeric: tabular-nums; }
  .caption h2 { margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
  .caption p { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--ink); }
  .hint { margin: 0; font-size: 14px; color: var(--ember); font-weight: 600; }
  .hint:empty { display: none; }

  .bar { display: flex; gap: 3px; }
  .bar span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
  .bar span i { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; background: var(--ember); }
  .bar span.done i { width: 100%; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn { border: 1px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 12px; min-height: 44px; padding: 0 14px;
    font: 600 15px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn.icon { min-width: 44px; padding: 0 10px; font-size: 18px; }
  .btn.primary { background: var(--ink); color: var(--chalk); min-width: 104px; }
  .btn.try[aria-pressed="true"] { background: var(--ember-soft); border-color: var(--ember); }
  .btn[disabled] { opacity: .35; cursor: default; }
  .btn[hidden] { display: none; }
  header .btn { min-height: 34px; flex: none; }
  :focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  /* Phones (not .wide): compact controls so the phone frame gets the room (Roei, 2026-10-09). */
  body:not(.wide) .wrap { gap: 6px; padding-block: 8px; }
  body:not(.wide) .top, body:not(.wide) .bottom { gap: 6px; }
  body:not(.wide) h1 { font-size: 17px; }
  body:not(.wide) header img { height: 22px; }
  body:not(.wide) .chap { padding: 4px 10px; font-size: 12px; }
  body:not(.wide) .btn { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  body:not(.wide) .btn.icon { min-width: 38px; padding: 0 8px; font-size: 16px; }
  body:not(.wide) .btn.primary { min-width: 88px; }
  body:not(.wide) .caption { padding: 8px 12px; border-radius: 14px; gap: 2px; }
  body:not(.wide) .caption .meta { font-size: 11px; }
  body:not(.wide) .caption h2 { font-size: 15.5px; }
  body:not(.wide) .caption p { font-size: 14px; line-height: 1.42; }
  /* LUMA site bar (same look as the top of luma.palgitraining.com) */
  .luma-bar { display: block; border-bottom: 1px solid var(--line); background: rgba(245, 241, 234, .96); } /* not the guide's header row */
  .luma-bar-in { max-width: 1000px; margin: 0 auto; padding-inline: 16px; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 14px; } /* logo + label together, centered (Roei) */
  .luma-brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #14243B; }
  .luma-mark { width: 26px; height: 26px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .luma-mark circle { stroke: #C0743A; opacity: .6; }
  .luma-mark path { stroke: currentColor; }
  .luma-word { font-family: 'Jost', 'Heebo', sans-serif; font-weight: 500; letter-spacing: .32em; font-size: 17px; direction: ltr; padding-left: .32em; }
  .luma-label { font-size: 13px; font-weight: 500; color: #5B6676; }
  @media (prefers-reduced-motion: reduce) {
    .finger { transition: opacity .2s; } .target, .ripple { animation: none; } .screen img { transition: none; }
  }
</style>
</head>

const STEPS = [{"id":"demo--cover","chapter":0,"title":"LUMA","text":"מערכת לניהול ספורטאים וקבוצות ספורט, בטלפון.","tap":null},{"id":"athlete--home","chapter":1,"title":"השבוע שלי","text":"כל ספורטאי רואה את האימונים שלו לשבוע הקרוב.","tap":null},{"id":"athlete--s-card","chapter":1,"title":"אימון כוח אישי","text":"התוכנית שהמאמן בנה, תרגיל אחר תרגיל.","tap":null},{"id":"athlete--s-set","chapter":1,"title":"דיווח תוך כדי אימון","text":"הספורטאי מתעד מה עשה בפועל.","tap":null},{"id":"athlete--pr-ex","chapter":1,"title":"רואים את ההתקדמות","text":"לכל תרגיל: מאיפה התחלנו ולאן הגענו.","tap":null},{"id":"fitness--ed-part","chapter":2,"title":"תוכנית לכל ספורטאי","text":"מאמן הכושר בונה לכל ספורטאי אימון אישי.","tap":null},{"id":"fitness--b-open","chapter":2,"title":"בנק תרגילים","text":"כל תרגיל נשמר פעם אחת, וההתקדמות נמדדת לאורך זמן.","tap":null},{"id":"athlete--e-box","chapter":3,"title":"כמה קשה היה","text":"הספורטאי נותן ציון לקושי ולמשך, והמערכת מחשבת עומס.","tap":null},{"id":"fitness--pg-load","chapter":3,"title":"עומס שבועי","text":"הצוות רואה קפיצות בעומס בזמן.","tap":null},{"id":"athlete--p-home","chapter":3,"title":"דיווח על כאב","text":"כאב מדווח מהטלפון ומגיע לצוות מיד.","tap":null},{"id":"fitness--at-item","chapter":3,"title":"מה דורש תשומת לב","text":"רשימה אחת לצוות של כל מה שצריך לבדוק.","tap":null},{"id":"manager--e-done","chapter":4,"title":"לוח אחד לכולם","text":"אימונים, תחרויות ופגישות בלוח אחד.","tap":null},{"id":"setter--r-entry","chapter":4,"title":"מי מגיע","text":"לכל אימון: מי מאמן ומי צפוי להגיע.","tap":null},{"id":"setter--f-fill","chapter":4,"title":"סיכום אימון","text":"מה עשינו ומי הגיע, ישר לספורטאים ולמאמנים.","tap":null},{"id":"coach--sum-fill","chapter":5,"title":"סיכומי פגישות","text":"חלק לספורטאי, וחלק שנשאר בתוך הצוות.","tap":null},{"id":"manager--an-form","chapter":5,"title":"הכרזות","text":"הודעה לכולם, ורואים מי קרא.","tap":null},{"id":"athlete--bell-list","chapter":5,"title":"התראות לטלפון","text":"כל עדכון מגיע כהתראה לטלפון       }
      later(dur, () => { if (index < STEPS.length - 1) { index++; render(); animate(); } else stop(true); });

  function go(i) { index = Math.max(0, Math.min(STEPS.length - 1, i)); render(); animate(); }

  });

  // The caption keeps the height of the longest step (no jumping), and the phone takes what is left of
  // the screen, so phone + explanation + buttons are all visible without scrolling.
  function fit() {
    const bar = document.getElementById('luma-bar');
    const H = window.innerHeight - (bar ? bar.offsetHeight : 0);
    const wide = window.innerWidth >= 720 && window.innerWidth > window.innerHeight * 0.9;
    document.body.classList.toggle('wide', wide);
    const cap = $('caption'), phone = $('phone'), wrap = document.querySelector('.wrap');
    const keep = [$('meta').textContent, $('stitle').textContent, $('stext').textContent];
    cap.style.minHeight = '0';
    let tallest = 0;
    STEPS.forEach((st, i) => { $('meta').textContent = 'x'; $('stitle').textContent = st.title; $('stext').textContent = st.text; tallest = Math.max(tallest, cap.offsetHeight); });
    [$('meta').textContent, $('stitle').textContent, $('stext').textContent] = keep;
    const reserve = tallest - cap.offsetHeight; // room for the tallest step (the try-it hint may add a small scroll; Roei's call)
    const pad = 20; // the frame around the screen
    const intro = document.querySelector('.intro');
    if (wide) { // the phone takes the full height beside the text
      intro.hidden = false;
      phone.style.width = Math.round(Math.max(150, Math.min(290, (H - 22 - pad) * 390 / 844 + pad))) + 'px';
      return;
    }
    const widthFor = () => (H - 2 - reserve - (wrap.offsetHeight - phone.offsetHeight) - pad) * 390 / 844 + pad;
    intro.hidden = false;
    if (widthFor() < 240) intro.hidden = true; // a short screen: the phone needs that line more
    phone.style.width = Math.round(Math.max(160, Math.min(330, wrap.clientWidth - 32, widthFor()))) + 'px';
  }
  render();
  fit();
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
